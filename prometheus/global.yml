global:
  scrape_interval: 60s

  external_labels:
    role: global

scrape_configs:
  - job_name: 'federate'

    honor_labels: true

    metrics_path: '/federate'

    params:
      'match[]':
        - '{__name__=~"job:.*"}'
        - '{__name__="up"}'

    static_configs:
      - targets:
          - 'prometheus-shard-a:9090'
          - 'prometheus-shard-b:9090'